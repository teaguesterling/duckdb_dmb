#
# Build and test dmb with DuckDB's reusable extension distribution workflow.
#
name: Main Extension Distribution Pipeline
on:
  # Pushes build only on main. A push to a PR branch fires a push run AND a
  # pull_request run for the same commit, so an unfiltered push trigger builds
  # every PR twice. The pull_request run is the one that matters for a PR.
  # Cost: a branch with no PR open gets no CI until the PR opens. Dispatch
  # still runs on any branch. (Same trigger as sitting_duck and duckdb_markdown.)
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}-${{ github.head_ref || '' }}-${{ github.base_ref || '' }}-${{ github.ref != 'refs/heads/main' && github.sha || '' }}
  cancel-in-progress: true

jobs:
  # Copied from sitting_duck's duckdb-v2-test-coverage job, the fleet's measured
  # working config for TESTS on v2.0.0 (158 passed there, 2026-10-25).
  #
  # duckdb_version is the v2.0.1 TAG, the same commit as the duckdb submodule
  # (8d78114e). No duckdb_tag: in duckdb_webbed, setting it made every test skip
  # (0 passed, 123 skipped) while the check stayed green.
  #
  # Every platform the community registry builds: no exclude_archs. If one breaks,
  # fix it or exclude it WITH THE ERROR RECORDED HERE (sitting_duck's rule): a bare
  # exclusion outlives its reason.
  #
  # Matrix width: reduced_ci_mode defaults to `auto`, which builds three arches on
  # pull requests (linux_amd64, windows_amd64, wasm_eh) and all of them on pushes to
  # main and on dispatch (measured in duckdb_markdown, 2026-09-13). Dispatch this
  # workflow on a branch to get the full matrix before it merges.
  duckdb-stable-build:
    name: Build extension binaries
    uses: duckdb/extension-ci-tools/.github/workflows/_extension_distribution.yml@main
    with:
      duckdb_version: v2.0.1
      ci_tools_version: main
      extension_name: dmb
      # A test file that cannot load dmb SKIPS on `require dmb`, and the runner
      # still prints success. `--require dmb` makes that a failure instead.
      # T is the test pattern ci-tools hands run_tests.py (`T ?=` in
      # duckdb_extension.Makefile, so this env var wins). Read the result as
      # `ran tests: N passed` in the Test step's log; N == 0 means no coverage,
      # whatever colour the check is.
      test_config: '{"test_env_variables": {"T": "--test-flags \"--require dmb\" \"test/sql/*\""}}'
